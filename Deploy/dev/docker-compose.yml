services:
  proxy:
    container_name: proxy
    build:
      context: ./proxy
      dockerfile: Dockerfile
    ports:
      - "80:80"
    volumes:
      - ../../laravel:/var/www/html
    depends_on:
      php:
        condition: service_started
      pgadmin:
        condition: service_healthy
    networks:
      - app-net

  php:
    container_name: php
    build:
      context: ../../laravel
      dockerfile: ../Deploy/dev/php/Dockerfile
    volumes:
      - ../../laravel:/var/www/html
    depends_on:
      pgsql:
        condition: service_healthy
    networks:
      - app-net

  pgsql:
    container_name: pgsql
    build:
      context: ./pgsql
      dockerfile: Dockerfile
    env_file:
      - ../../laravel/.env
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - app-net

  pgadmin:
    container_name: pgadmin
    build:
      context: ./pgadmin
      dockerfile: Dockerfile
    env_file:
      - ../../laravel/.env
    ports:
      - "8080:8080"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      pgsql:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    networks:
      - app-net

volumes:
  pgdata:
  pgadmin_data:

networks:
  app-net:
    driver: bridge