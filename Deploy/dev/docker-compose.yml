services:
  nginx:
    container_name: nginx-dev
    build:
      context: ../..
      dockerfile: Deploy/dev/proxy/Dockerfile
    ports:
      - "80:80"
    volumes:
      - ../../laravel:/var/www/html:ro
    depends_on:
      backend:
        condition: service_started
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - app-net

  backend:
    container_name: backend-dev
    build:
      context: ../..
      dockerfile: Deploy/dev/php/Dockerfile
    volumes:
      - ../../laravel:/var/www/html
    depends_on:
      pgsql:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - app-net

  pgsql:
    container_name: postgres-dev
    build:
      context: ../..
      dockerfile: Deploy/dev/pgsql/Dockerfile
    env_file:
      - ../../laravel/.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - app-net

  pgadmin:
    container_name: pgadmin-dev
    build:
      context: ../..
      dockerfile: Deploy/dev/pgadmin/Dockerfile
    env_file:
      - ../../laravel/.env
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      pgsql:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    networks:
      - app-net

  frontend:
    container_name: frontend-dev
    build:
      context: ../..
      dockerfile: Deploy/dev/frontend/Dockerfile
    volumes:
      - ../../laravel:/app
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    networks:
      - app-net

volumes:
  pgdata:
  pgadmin_data:

networks:
  app-net:
    driver: bridge