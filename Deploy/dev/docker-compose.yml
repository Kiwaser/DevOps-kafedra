services:
  proxy:
    container_name: proxy
    build:
      context: ./proxy
      dockerfile: Dockerfile
    ports:
      - "80:80"
    volumes:
      - ../../laravel:/var/www/html
    depends_on:
      - php
    networks:
      - app-net

  php:
    container_name: php
    build:
      context: ../../laravel
      dockerfile: ../Deploy/dev/php/Dockerfile
    volumes:
      - ../../laravel:/var/www/html
    depends_on:
      pgsql:
        condition: service_healthy
    networks:
      - app-net

  pgsql:
    container_name: pgsql
    build:
      context: ./pgsql
      dockerfile: Dockerfile
    env_file:
      - ../../laravel/.env
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - app-net

volumes:
  pgdata:

networks:
  app-net:
    driver: bridge
