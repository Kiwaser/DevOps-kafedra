services:
  proxy:
    image: nginx:alpine
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - ../../laravel:/var/www/html
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf
      - pma_data:/var/www/pma:ro
      - ./proxy/phpmyadmin.conf:/etc/nginx/conf.d/phpmyadmin.conf
    depends_on:
      - php
      - phpmyadmin
    networks:
      - app-net

  php:
    build:
      context: ../../laravel
      dockerfile: ../Deploy/dev/php/Dockerfile
    volumes:
      - ../../laravel:/var/www/html
    networks:
      - app-net


  mysql:
    image: mysql:9
    env_file:
      - ../../laravel/.env
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - app-net

  phpmyadmin:
    image: phpmyadmin:5.2.3-fpm-alpine
    volumes:
      - pma_data:/var/www/html
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    depends_on:
      - mysql
    networks:
      - app-net

volumes:
  mysql_data:
  pma_data:

networks:
  app-net:
    driver: bridge