services:
  proxy:
    container_name: proxy
    build:
      context: ./proxy
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - ../../laravel:/var/www/html
      - pma_data:/var/www/pma:ro
    depends_on:
      - php
      - phpmyadmin
    networks:
      - app-net

  php:
    container_name: php
    build:
      context: ../../laravel
      dockerfile: ../Deploy/dev/php/Dockerfile
    volumes:
      - ../../laravel:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app-net

  mysql:
    container_name: mysql
    build:
      context: ./mysql
      dockerfile: Dockerfile
    env_file:
      - ../../laravel/.env
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - app-net

  phpmyadmin:
    container_name: phpmyadmin
    build:
      context: ./phpmyadmin
      dockerfile: Dockerfile
    volumes:
      - pma_data:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app-net

volumes:
  mysql_data:
  pma_data:

networks:
  app-net:
    driver: bridge
