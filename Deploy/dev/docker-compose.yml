services:
  proxy:
    container_name: proxy
    build:
      context: ./proxy
      dockerfile: Dockerfile
    ports:
      - "80:80"
    volumes:
      - ../../laravel:/var/www/html
    depends_on:
      php:
        condition: service_started
      # proxy стартует только после того, как pgAdmin реально отвечает,
      # поэтому `docker compose up -d` не напишет «Started», пока pgAdmin не готов
      pgadmin:
        condition: service_healthy
    networks:
      - app-net

  php:
    container_name: php
    build:
      context: ../../laravel
      dockerfile: ../Deploy/dev/php/Dockerfile
    volumes:
      - ../../laravel:/var/www/html
    depends_on:
      pgsql:
        condition: service_healthy
    networks:
      - app-net

  pgsql:
    container_name: pgsql
    build:
      context: ./pgsql
      dockerfile: Dockerfile
    env_file:
      - ../../laravel/.env
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - app-net

  pgadmin:
    container_name: pgadmin
    build:
      context: ./pgadmin
      dockerfile: Dockerfile
    env_file:
      - ../../laravel/.env
    ports:
      - "8080:8080"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    # Здоров = ping отвечает "PING" И страница логина отдаётся с кодом 200
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 5 -O - http://127.0.0.1:8080/misc/ping | grep -q PING && wget -q -T 10 -O /dev/null http://127.0.0.1:8080/login || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 300s
      start_interval: 3s
    depends_on:
      pgsql:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    networks:
      - app-net

volumes:
  pgdata:
  pgadmin_data:

networks:
  app-net:
    driver: bridge